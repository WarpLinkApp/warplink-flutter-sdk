name: warplink_flutter
description: Deep linking, install attribution, and real-time link analytics for Flutter apps on iOS and Android, from one SDK.
version: 1.1.0
homepage: https://warplink.app
repository: https://github.com/WarpLinkApp/warplink-flutter-sdk
issue_tracker: https://github.com/WarpLinkApp/warplink-flutter-sdk/issues
documentation: https://warplink.app/docs/sdks/flutter

topics:
  - deep-linking
  - attribution
  - analytics
  - deferred-deep-linking
  - app-links

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.warplink.flutter
        pluginClass: WarpLinkFlutterPlugin
      ios:
        pluginClass: WarpLinkFlutterPlugin
